# Simule, pour la mesure locale, la partie d'un CDN/reverse-proxy edge qui compte pour C2 :
# la mise en cache HTTP du trafic de lecture public. Un vrai CDN (points de présence
# géographiques, absorption volumétrique à l'échelle internet) reste hors de portée d'un seul
# hôte Docker Desktop — voir performance/rapport-performance.md §5 et ADR-002. Ce proxy ne teste
# que ce qui est honnêtement testable en local : le delta de latence cache-hit / cache-miss sur
# l'endpoint public non authentifié (`recherche`, BF-03).
#
# TTL de 30s aligné sur le cache applicatif Redis existant (getCachedSearch/setCachedSearch,
# ADR-002) pour rester comparable : ce proxy n'ajoute pas un cache plus agressif que celui déjà
# validé par la mesure, il déplace le point où le cache-hit est servi (edge plutôt qu'applicatif).
proxy_cache_path /var/cache/nginx/cdn levels=1:2 keys_zone=cdn_cache:10m max_size=100m inactive=10m use_temp_path=off;

log_format cdn_cache '$time_iso8601 "$request" status=$status cache=$upstream_cache_status rt=$request_time';

server {
    listen 80;
    access_log /var/log/nginx/access.log cdn_cache;

    # Seul le trafic de recherche public (non authentifié, sans cookie de session) est mis en
    # cache. Tout le reste (connexion, MFA, réservation, back-office) passe en direct vers l'app,
    # sans mise en cache, pour ne jamais risquer de servir une réponse liée à une session.
    location /api/search {
        proxy_cache cdn_cache;
        proxy_cache_key "$request_uri";
        proxy_cache_valid 200 30s;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
